[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "octelium-sdk"
version = "1.1.0"
description = "Octelium Python SDK"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]

authors = [
    { name = "Octelium", email = "contact@octelium.com" }
]

keywords = [
    "octelium",
    "ztna",
    "zero-trust",
    "grpc",
    "sdk",
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]

dependencies = [
    "octelium-apis>=1.0.3,<2",
    "aiohttp>=3.9.0",
    "betterproto>=2.0.0b7",
    "grpclib>=0.4.7",
    "multidict>=6.0.5",
    "yarl>=1.9.2",
]

[project.urls]
Homepage = "https://octelium.com"
Repository = "https://github.com/octelium/sdk-python"
Documentation = "https://octelium.com/docs"

[tool.setuptools.packages.find]
where = ["."]
include = ["octelium.sdk*"]

[tool.setuptools.package-data]
"octelium.sdk" = ["py.typed"]
