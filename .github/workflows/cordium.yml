name: Octelium Python SDKs
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check packages/cordium packages/sdk scripts
      - run: mypy
      - run: pytest
      - name: Test minimum transport dependencies
        if: matrix.python == '3.11'
        run: |
          python -m pip install 'httpx==0.27.0' 'grpclib==0.4.8'
          pytest
      - name: Test minimum Cluster SDK transport dependencies
        if: matrix.python == '3.11'
        run: |
          python -m venv /tmp/sdk-minimum-test
          /tmp/sdk-minimum-test/bin/python -m pip install ./packages/apis ./packages/sdk 'aiohttp==3.9.0' 'grpclib==0.4.7' 'multidict==6.0.5' 'yarl==1.9.2' 'pytest>=8,<10' 'pytest-asyncio>=1,<2'
          /tmp/sdk-minimum-test/bin/python -m pytest --import-mode=importlib packages/sdk/tests
      - run: python -m build packages/apis && python -m build packages/cordium && python -m build packages/sdk
      - run: python -m twine check packages/apis/dist/* packages/cordium/dist/* packages/sdk/dist/*
      - name: Verify generated facade and reference
        if: matrix.python == '3.11'
        run: |
          python scripts/generate_sync.py
          python scripts/generate_reference.py
          git diff --exit-code -- packages/cordium/src/cordium/sync.py packages/cordium/docs/api.md
      - name: Install and check wheels outside the checkout
        shell: bash
        run: |
          python -m venv /tmp/cordium-wheel-test
          /tmp/cordium-wheel-test/bin/python -m pip install packages/apis/dist/*.whl packages/sdk/dist/*.whl packages/cordium/dist/*.whl
          cd /tmp
          /tmp/cordium-wheel-test/bin/python -c 'from cordium import Cordium, AsyncCordium, proto; assert proto.Volume; assert proto.WorkspaceSnapshot'
      - name: Install the Cluster SDK wheel with its declared dependencies
        shell: bash
        run: |
          python -m venv /tmp/sdk-wheel-test
          /tmp/sdk-wheel-test/bin/python -m pip install --find-links packages/apis/dist packages/sdk/dist/*.whl
          cd /tmp
          /tmp/sdk-wheel-test/bin/python -c 'from octelium.sdk import OcteliumClient, OcteliumClientConfig; from octelium.api.main.auth.v1 import SessionToken; assert OcteliumClient and OcteliumClientConfig and SessionToken'
