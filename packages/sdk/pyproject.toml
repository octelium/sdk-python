[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "octelium-sdk"
version = "0.0.0"
description = "Octelium Python SDK"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }

authors = [
    { name = "Octelium", email = "contact@octelium.com" }
]

keywords = [
    "octelium",
    "ztna",
    "zero-trust",
    "grpc",
    "sdk",
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]

dependencies = [
    "aiohttp>=3.9.0",
    "betterproto>=2.0.0b7",
    "grpclib>=0.4.7",
    "typing-extensions>=4.9.0; python_version < '3.11'",
]

[project.urls]
Homepage = "https://octelium.com"
Repository = "https://github.com/octelium/sdk-python"
Documentation = "https://octelium.com/docs"

[tool.setuptools.packages.find]
where = ["."]
include = ["octelium*"]

[tool.setuptools.package-data]
octelium = ["py.typed"]